# pytest.ini
[pytest]
# 测试目录
testpaths = tests

# Python 路径
pythonpath = .

# 测试文件匹配模式
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 日志级别
log_cli = true
log_cli_level = INFO

# 标记
markers =
    slow: 标记慢速测试
    integration: 集成测试（需要真实 LLM）
    unit: 单元测试

# 忽略目录
norecursedirs = .git .venv venv env __pycache__ .pytest_cache logs data data_driver pytest_scripts testpoint_output

# 覆盖率配置（需要 pip install pytest-cov）
# 运行方式: pytest --cov=src --cov-report=html